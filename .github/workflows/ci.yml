name: Server CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-vetau-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REMOTE_APP_DIR: /srv/huochepiao
  SERVICES: >-
    discovery-service
    config-server
    api-gateway
    order-service
    payment-service
    search-service
    ticket-service
    user-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - run: mvn --no-transfer-progress test

  docker-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: |
          docker compose build \
            discovery-service \
            config-server \
            api-gateway \
            order-service \
            payment-service \
            search-service \
            ticket-service \
            user-service

  deploy:
    runs-on: ubuntu-latest
    needs: docker-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: |
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "IMAGE_TAG=sha-${SHORT_SHA}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Build and push images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          for SERVICE in $SERVICES; do
            IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${SERVICE}-${IMAGE_TAG}"
            docker build --build-arg MODULE="$SERVICE" -t "$IMAGE_URI" .
            docker push "$IMAGE_URI"
          done

      - name: Deploy via SSH
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ vars.EC2_PORT }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_USER: ${{ vars.EC2_USER }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail

          trim() {
            printf '%s' "$1" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }

          REMOTE_COMMANDS=$(cat <<EOF
          AWS_REGION="$AWS_REGION"
          ECR_REGISTRY="$ECR_REGISTRY"
          ECR_REPOSITORY="$ECR_REPOSITORY"
          IMAGE_TAG="$IMAGE_TAG"
          REMOTE_APP_DIR="$REMOTE_APP_DIR"
          REPOSITORY_URL="$REPOSITORY_URL"
          REMOTE_BASE_DIR="\$(dirname "\$REMOTE_APP_DIR")"

          mkdir -p "\$REMOTE_BASE_DIR"

          if [ ! -d "\$REMOTE_APP_DIR/.git" ]; then
            rm -rf "\$REMOTE_APP_DIR"
            git clone --branch main "\$REPOSITORY_URL" "\$REMOTE_APP_DIR"
          fi

          cd "\$REMOTE_APP_DIR"
          git fetch origin main
          git reset --hard origin/main

          aws ecr get-login-password --region "\$AWS_REGION" | docker login --username AWS --password-stdin "\$ECR_REGISTRY"

          export ECR_REGISTRY
          export ECR_REPOSITORY
          export IMAGE_TAG

          docker compose -f docker-compose.yml -f docker-compose.ecr.yml pull
          docker compose -f docker-compose.yml -f docker-compose.ecr.yml up -d --remove-orphans
          EOF
          )

          SSH_HOST="$(trim "${EC2_HOST:-}")"
          SSH_PORT="$(trim "${EC2_PORT:-22}")"
          SSH_USER="$(trim "${EC2_USER:-}")"
          SSH_KEY_CONTENT="$(printf '%s' "${EC2_SSH_PRIVATE_KEY:-}" | tr -d '\r')"

          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY_CONTENT" ]; then
            echo "::error::SSH deploy is missing EC2_HOST, EC2_USER, or EC2_SSH_PRIVATE_KEY."
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY_CONTENT" > "$HOME/.ssh/ec2_deploy_key"
          chmod 600 "$HOME/.ssh/ec2_deploy_key"

          ssh -i "$HOME/.ssh/ec2_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" \
            "bash -se" <<<"$REMOTE_COMMANDS"
