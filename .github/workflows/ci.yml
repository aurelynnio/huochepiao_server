name: Server CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-vetau-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn --no-transfer-progress test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/*

  docker-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate service images
        run: |
          docker compose build \
            config-server \
            discovery-service \
            api-gateway \
            order-service \
            payment-service \
            search-service \
            ticket-service \
            user-service

  deploy:
    name: Push ECR and Deploy EC2
    runs-on: ubuntu-latest
    needs: docker-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: image
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          IMAGE_TAG="sha-${SHORT_SHA}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build and push service images
        run: |
          set -e

          SERVICES=(
            config-server
            discovery-service
            api-gateway
            order-service
            payment-service
            search-service
            ticket-service
            user-service
          )

          for SERVICE in "${SERVICES[@]}"; do
            IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${SERVICE}-${IMAGE_TAG}"

            echo "Building $SERVICE as $IMAGE_URI"
            docker build \
              --build-arg MODULE="$SERVICE" \
              -t "$IMAGE_URI" \
              .

            echo "Pushing $SERVICE"
            docker push "$IMAGE_URI"
          done

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e

            AWS_REGION="${{ vars.AWS_REGION }}"
            ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
            ECR_REPOSITORY="${{ vars.ECR_REPOSITORY }}"
            IMAGE_TAG="${{ steps.image.outputs.IMAGE_TAG }}"
            REMOTE_APP_DIR="/srv/huochepiao"
            REMOTE_BASE_DIR="$(dirname "$REMOTE_APP_DIR")"
            REPOSITORY_URL="https://github.com/${{ github.repository }}.git"

            SERVICES="
            config-server
            discovery-service
            api-gateway
            order-service
            payment-service
            search-service
            ticket-service
            user-service
            "

            echo "Preparing remote app directory..."
            echo "Remote app directory: $REMOTE_APP_DIR"

            mkdir -p "$REMOTE_BASE_DIR"

            if [ -d "$REMOTE_APP_DIR/.git" ]; then
              echo "Existing git repository found. Updating it..."
              cd "$REMOTE_APP_DIR"
              git fetch origin main
              git reset --hard origin/main
            elif [ ! -e "$REMOTE_APP_DIR" ]; then
              echo "Remote app directory does not exist. Cloning repository..."
              git clone --branch main "$REPOSITORY_URL" "$REMOTE_APP_DIR"
              cd "$REMOTE_APP_DIR"
            elif [ -d "$REMOTE_APP_DIR" ] && [ -z "$(find "$REMOTE_APP_DIR" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null || true)" ]; then
              echo "Remote app directory is empty. Cloning repository..."
              rm -rf "$REMOTE_APP_DIR"
              git clone --branch main "$REPOSITORY_URL" "$REMOTE_APP_DIR"
              cd "$REMOTE_APP_DIR"
            else
              BACKUP_DIR="${REMOTE_APP_DIR}.bak.$(date +%Y%m%d%H%M%S)"
              echo "$REMOTE_APP_DIR exists, but it is not a git repository."
              echo "Moving existing directory to $BACKUP_DIR"
              mv "$REMOTE_APP_DIR" "$BACKUP_DIR"
              git clone --branch main "$REPOSITORY_URL" "$REMOTE_APP_DIR"
              cd "$REMOTE_APP_DIR"
            fi

            echo "Logging in to ECR..."
            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            echo "Writing Docker Compose ECR override..."
            cat > docker-compose.ecr.yml <<EOF
            services:
              config-server:
                image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:config-server-${IMAGE_TAG}
              discovery-service:
                image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:discovery-service-${IMAGE_TAG}
              api-gateway:
                image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:api-gateway-${IMAGE_TAG}
              order-service:
                image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:order-service-${IMAGE_TAG}
              payment-service:
                image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:payment-service-${IMAGE_TAG}
              search-service:
                image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:search-service-${IMAGE_TAG}
              ticket-service:
                image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:ticket-service-${IMAGE_TAG}
              user-service:
                image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:user-service-${IMAGE_TAG}
            EOF

            echo "Pulling service images..."
            for SERVICE in $SERVICES; do
              docker pull "${ECR_REGISTRY}/${ECR_REPOSITORY}:${SERVICE}-${IMAGE_TAG}"
            done

            echo "Starting services with Docker Compose..."
            docker compose -f docker-compose.yml -f docker-compose.ecr.yml up -d --no-build

            echo "Service container status:"
            docker compose -f docker-compose.yml -f docker-compose.ecr.yml ps

            echo "Recent API gateway logs:"
            docker logs api-gateway --tail=80 || true

            echo "Cleaning old images..."
            docker image prune -af || true
