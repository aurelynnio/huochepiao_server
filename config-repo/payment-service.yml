spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:mysql://localhost:3306/payment_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${PAYMENT_DB_USERNAME:root}
    password: ${PAYMENT_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${SERVER_PORT:8084}

app:
  client:
    payment-result-url: ${PAYMENT_CLIENT_RESULT_URL:https://vetautet.app/payment-result}

vnpay:
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://api.vetautet.app/api/payments/vnpay/callback}
  tmn-code: ${VNPAY_TMN_CODE:ASZ3R2I3}
  hash-secret: ${VNPAY_HASH_SECRET:69GLTLV9HI0UI11OT6HK7OVV3LKN6CCS}
  api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
