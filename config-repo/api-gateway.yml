spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              "[/**]":
                allowed-origins:
                  - "http://localhost:3000"
                  - "http://127.0.0.1:3000"
                  - "http://vetautet.app"
                  - "http://www.vetautet.app"
                  - "https://vetautet.app"
                  - "https://www.vetautet.app"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: true
          routes:
            - id: search-service
              uri: http://search-service:8085
              predicates:
                - Path=/api/search/tickets,/api/search/tickets/**
            - id: user-auth-service
              uri: http://user-service:8081
              predicates:
                - Path=/api/users/login,/api/users/register,/api/users/logout
              filters:
                - StripPrefix=2
                - PrefixPath=/v1
            - id: user-service
              uri: http://user-service:8081
              predicates:
                - Path=/api/users,/api/users/**
              filters:
                - StripPrefix=1
                - PrefixPath=/v1
            - id: ticket-service
              uri: http://ticket-service:8086
              predicates:
                - Path=/api/tickets,/api/tickets/**
              filters:
                - StripPrefix=1
                - PrefixPath=/v1
            - id: order-service
              uri: http://order-service:8083
              predicates:
                - Path=/api/orders,/api/orders/**
              filters:
                - StripPrefix=1
                - PrefixPath=/v1
            - id: payment-service
              uri: http://payment-service:8084
              predicates:
                - Path=/api/payments,/api/payments/**
              filters:
                - StripPrefix=1
                - PrefixPath=/v1

server:
  port: ${SERVER_PORT:8080}
