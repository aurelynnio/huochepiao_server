spring:
  application:
    name: user-service
  datasource:
    url: ${USER_DB_URL:jdbc:mysql://localhost:3306/user_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${USER_DB_USERNAME:root}
    password: ${USER_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:${jwt.issuer}}
          jwk-set-uri: ${AUTH_JWK_SET_URI:${AUTH_ISSUER_URI:${jwt.issuer}}/.well-known/jwks.json}
      client:
        registration:
          my-client:
            provider: okta
            client-id: ${OKTA_CLIENT_ID:}
            client-secret: ${OKTA_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email
        provider:
          okta:
            authorization-uri: ${okta.base-url}/oauth2/v1/authorize
            token-uri: ${okta.base-url}/oauth2/v1/token
            user-info-uri: ${okta.base-url}/oauth2/v1/userinfo
            jwk-set-uri: ${okta.base-url}/oauth2/v1/keys
            user-name-attribute: sub

server:
  port: ${SERVER_PORT:8081}

app:
  auth:
    password-reset:
      preview-enabled: ${PASSWORD_RESET_PREVIEW_ENABLED:true}

jwt:
  issuer: ${JWT_ISSUER:http://localhost:8081}
  key-id: ${JWT_KEY_ID:user-service-key-1}
  private-key: ${JWT_PRIVATE_KEY:}
  public-key: ${JWT_PUBLIC_KEY:}
  default-tenant-id: ${JWT_DEFAULT_TENANT_ID:public}
  access-expiration: 900000
  refresh-expiration: 604800000

okta:
  base-url: ${OKTA_BASE_URL:}
